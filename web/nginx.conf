# Gateway for the web image (D-085, D-084). Copied to /etc/nginx/conf.d/default.conf.
#   /                      the SPA (history mode: unknown paths fall back to index.html)
#   /api/<service>/...     proposal, notification, analytics, with the /api/<service> prefix stripped
#                          (same mapping as the dev proxy in vite.config.ts)
# Customer is not routed (D-043). /r/ (click redirect, D-082) arrives with T-044.

# Keep the caller's X-Request-Id, otherwise mint one.
map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    # nginx would otherwise turn a relative Location into http://<host>/..., losing the published host port.
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Upstreams are variables, so they are resolved per request (valid=10s):
    # nginx starts while a service is down and follows a restarted container to its new IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # gzip for text assets and JSON. text/event-stream is deliberately absent so SSE frames are never held back.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript text/javascript application/json
               application/problem+json image/svg+xml font/woff2;

    # ---- proxy settings shared by every /api/ location (set here, inherited by them) ----
    # Unbuffered, HTTP/1.1, empty Connection: SSE (campaign events, delivery events) flows frame by frame.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $req_id;

    # Proposal answers POST /campaigns with "Location: /campaigns/{id}" (D-072); make it a gateway path.
    # notification and analytics send no Location header, so they need no proxy_redirect.
    location ^~ /api/proposal/ {
        set $upstream http://proposal:8080;
        rewrite ^/api/proposal/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_redirect /campaigns/ /api/proposal/campaigns/;
    }

    location ^~ /api/notification/ {
        set $upstream http://notification:8080;
        rewrite ^/api/notification/(.*)$ /$1 break;
        proxy_pass $upstream;
    }

    location ^~ /api/analytics/ {
        set $upstream http://analytics:8080;
        rewrite ^/api/analytics/(.*)$ /$1 break;
        proxy_pass $upstream;
    }

    # Any other /api path (customer, typos) is not routed and must not fall back to the SPA.
    location /api/ {
        return 404;
    }

    # Vite emits content-hashed files under /assets/: cache them for a year.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The shell is never cached, so a deploy is picked up on the next load.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
