# Smart Campaign Composer — local stack.
# Single Postgres service hosting one database per microservice (docs/database-architecture.md).
# First `up` on an empty volume creates customer_db (seeded from ./stub) and the empty service DBs
# proposal_db, notification_db, analytics_db, each with an owner role and a same-named schema.
# Also runs NATS JetStream (file storage, volume natsdata). The one-shot `nats-init` service creates/updates
# the streams from infra/nats/streams/*.json on every `up` (idempotent, D-049).
# The five Go services (customer, proposal, notification, analytics, mockprovider) are built from the
# root Dockerfile (SERVICE build arg) and wait for postgres / nats-init (D-056). Host ports: proposal 8081,
# notification 8082, analytics 8083, mockprovider 8084; customer is reachable only inside the compose network.
# API_DOCS_ENABLED (default true here, false in code) serves /docs and /openapi.json on the four REST services (D-057).
# Rebuild from scratch after schema/stub changes:  docker compose down -v && docker compose up -d
name: coldbru

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
      CUSTOMER_DB_PASSWORD: ${CUSTOMER_DB_PASSWORD:-customer_svc_dev}
      PROPOSAL_DB_PASSWORD: ${PROPOSAL_DB_PASSWORD:-proposal_svc_dev}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-notification_svc_dev}
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD:-analytics_svc_dev}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql            # postgres 18 image: PGDATA=/var/lib/postgresql/18/docker
      - ./infra/postgres/initdb:/docker-entrypoint-initdb.d:ro
      - ./stub:/seed/stub:ro
    healthcheck:
      # TCP + app role + seeded table: the init-time server listens on a socket only,
      # so this stays unhealthy until the seed has committed. Each service role must also
      # reach its own DB and see its own schema as current_schema() (D-048).
      test:
        - CMD-SHELL
        - >-
          PGPASSWORD="$${CUSTOMER_DB_PASSWORD}" psql -h 127.0.0.1 -U customer_svc -d customer_db
          -tAc 'SELECT 1 FROM dwh.dim_customer LIMIT 1' | grep -q 1
          && PGPASSWORD="$${PROPOSAL_DB_PASSWORD}" psql -h 127.0.0.1 -U proposal_svc -d proposal_db
          -tAc 'SELECT current_schema()' | grep -qx proposal
          && PGPASSWORD="$${NOTIFICATION_DB_PASSWORD}" psql -h 127.0.0.1 -U notification_svc -d notification_db
          -tAc 'SELECT current_schema()' | grep -qx notification
          && PGPASSWORD="$${ANALYTICS_DB_PASSWORD}" psql -h 127.0.0.1 -U analytics_svc -d analytics_db
          -tAc 'SELECT current_schema()' | grep -qx analytics
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 60s

  nats:
    image: nats:2.15-alpine
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "${NATS_HOST_PORT:-4222}:4222"
      - "${NATS_MONITOR_HOST_PORT:-8222}:8222"
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 'http://127.0.0.1:8222/healthz?js-enabled-only=true' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  nats-init:
    image: natsio/nats-box:0.20.0
    restart: "no"
    depends_on:
      nats:
        condition: service_healthy
    volumes:
      - ./infra/nats:/nats-init:ro
    entrypoint: ["sh", "/nats-init/init-streams.sh"]

  customer:
    build:
      context: .
      args:
        SERVICE: customer
    image: coldbru-customer:dev
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://customer_svc:${CUSTOMER_DB_PASSWORD:-customer_svc_dev}@postgres:5432/customer_db?sslmode=disable
      CUSTOMER_TOKEN_PROPOSAL: ${CUSTOMER_TOKEN_PROPOSAL:-proposal-dev-token}
      CUSTOMER_TOKEN_NOTIFICATION: ${CUSTOMER_TOKEN_NOTIFICATION:-notification-dev-token}
      CUSTOMER_TOKEN_ADMIN: ${CUSTOMER_TOKEN_ADMIN:-admin-dev-token}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  proposal:
    build:
      context: .
      args:
        SERVICE: proposal
    image: coldbru-proposal:dev
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_ADDR: ":8080"
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
      DATABASE_URL: postgres://proposal_svc:${PROPOSAL_DB_PASSWORD:-proposal_svc_dev}@postgres:5432/proposal_db?sslmode=disable
      NATS_URL: nats://nats:4222
      CUSTOMER_GRAPHQL_URL: http://customer:8080/graphql
      CUSTOMER_TOKEN: ${CUSTOMER_TOKEN_PROPOSAL:-proposal-dev-token}
    ports:
      - "${PROPOSAL_HOST_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      nats-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  notification:
    build:
      context: .
      args:
        SERVICE: notification
    image: coldbru-notification:dev
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_ADDR: ":8080"
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
      DATABASE_URL: postgres://notification_svc:${NOTIFICATION_DB_PASSWORD:-notification_svc_dev}@postgres:5432/notification_db?sslmode=disable
      NATS_URL: nats://nats:4222
    ports:
      - "${NOTIFICATION_HOST_PORT:-8082}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      nats-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  analytics:
    build:
      context: .
      args:
        SERVICE: analytics
    image: coldbru-analytics:dev
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_ADDR: ":8080"
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
      DATABASE_URL: postgres://analytics_svc:${ANALYTICS_DB_PASSWORD:-analytics_svc_dev}@postgres:5432/analytics_db?sslmode=disable
      NATS_URL: nats://nats:4222
    ports:
      - "${ANALYTICS_HOST_PORT:-8083}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      nats-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  mockprovider:
    build:
      context: .
      args:
        SERVICE: mockprovider
    image: coldbru-mockprovider:dev
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_ADDR: ":8080"
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
    ports:
      - "${MOCKPROVIDER_HOST_PORT:-8084}:8080"
    healthcheck:
      test: ["CMD", "/app", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  pgdata:
  natsdata:
